name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        # The plain ffmpeg formula no longer ships libass (no ass
        # filter); the full build moved to ffmpeg-full, which is
        # keg-only, so link it for `ffmpeg` to land on PATH.
        run: brew install ffmpeg-full && brew link --overwrite ffmpeg-full
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
      - name: Install project
        run: pip install -e ".[dev,web,bot]"
      - name: Run tests (offline, fake engines, no model downloads)
        run: pytest -q
