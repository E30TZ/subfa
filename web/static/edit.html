<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SubFa: ویرایش زیرنویس / Edit subtitles</title>
<style>
  :root { --ink:#14231c; --muted:#4c5f55; --line:#cfe0d6; --brand:#047857; --bg:#f4f8f5; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Vazirmatn, Tahoma, system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; }
  p { color: var(--muted); line-height: 1.9; }
  table { width:100%; border-collapse: collapse; background:#fff; }
  th, td { border:1px solid var(--line); padding:6px; vertical-align: top; }
  th { font-size: 13px; color: var(--muted); }
  input[type=number] { width: 92px; padding:8px; font:inherit; }
  textarea { width:100%; min-height:44px; padding:8px; font:inherit; resize: vertical; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; margin:16px 0; }
  button { font:inherit; cursor:pointer; border-radius:10px; padding:12px 18px; min-height:48px; border:1px solid var(--line); background:#fff; }
  button.primary { background:var(--brand); color:#fff; border:0; }
  select { padding:10px; font:inherit; border:1px solid var(--line); border-radius:10px; background:#fff; }
  #msg { margin-top:12px; font-size:14px; }
  a { color: var(--brand); }
</style>
</head>
<body>
<main>
  <h1>ویرایش زیرنویس / Edit subtitles</h1>
  <p>متن هر زیرنویس را اصلاح کن، ذخیره کن، و بدون پیاده‌سازی دوباره، ویدیوی زیرنویس‌دار را از نو بساز یا فایل اصلاح‌شده را دانلود کن.<br>Fix any cue, save, and re-burn or re-download. No re-transcription.</p>
  <div class="bar">
    <select id="kind">
      <option value="srt">زیرنویس اصلی / Target subtitles</option>
      <option value="bilingual">دوزبانه / Bilingual</option>
    </select>
    <button id="load" type="button">بارگذاری / Load</button>
    <button id="save" type="button" class="primary">ذخیره / Save</button>
    <button id="reburn" type="button">ساخت دوباره ویدیو / Re-burn video</button>
    <a id="back" href="/">بازگشت / Back</a>
  </div>
  <table>
    <thead><tr>
      <th>شروع (ثانیه) / Start</th><th>پایان (ثانیه) / End</th><th>متن / Text</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="msg"></div>
</main>
<script>
const jobId = location.pathname.split("/")[2];
const rows = document.getElementById("rows");
const msg = document.getElementById("msg");
const kindSel = document.getElementById("kind");

async function load() {
  msg.textContent = "";
  const res = await fetch("/jobs/" + jobId + "/cues?kind=" + kindSel.value);
  const data = await res.json();
  if (data.error) { msg.textContent = data.error; rows.innerHTML = ""; return; }
  rows.innerHTML = "";
  data.cues.forEach(c => {
    const tr = document.createElement("tr");
    tr.innerHTML = '<td><input type="number" step="0.1" min="0" value="' + c.start.toFixed(2) + '"></td>' +
      '<td><input type="number" step="0.1" min="0" value="' + c.end.toFixed(2) + '"></td>' +
      '<td><textarea>' + c.text.replace(/&/g, "&amp;").replace(/</g, "&lt;") + "</textarea></td>";
    rows.appendChild(tr);
  });
  msg.textContent = data.cues.length + " cues";
}
function collect() {
  return Array.from(rows.querySelectorAll("tr")).map(tr => {
    const inputs = tr.querySelectorAll("input");
    return { start: parseFloat(inputs[0].value), end: parseFloat(inputs[1].value), text: tr.querySelector("textarea").value };
  });
}
document.getElementById("load").addEventListener("click", load);
kindSel.addEventListener("change", load);
document.getElementById("save").addEventListener("click", async () => {
  const res = await fetch("/jobs/" + jobId + "/cues?kind=" + kindSel.value, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ cues: collect() })
  });
  const data = await res.json();
  msg.textContent = data.error ? data.error : ("Saved " + data.saved + " cues / ذخیره شد");
});
document.getElementById("reburn").addEventListener("click", async () => {
  await fetch("/jobs/" + jobId + "/cues?kind=" + kindSel.value, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ cues: collect() })
  });
  const res = await fetch("/jobs/" + jobId + "/reburn?kind=" + kindSel.value, { method: "POST" });
  const data = await res.json();
  msg.innerHTML = data.error ? data.error :
    'Re-burned / ساخته شد: <a href="/jobs/' + jobId + '/files/burned">' + data.burned + "</a>";
});
load();
</script>
</body>
</html>
